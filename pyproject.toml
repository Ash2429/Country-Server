[project]
name = "country-server"
version = "0.1.0"
description = "GraphQL service for ingesting and querying country data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "motor>=3.7.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "strawberry-graphql[fastapi]>=0.323.2",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
app = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
